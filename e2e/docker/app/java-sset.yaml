name: cms-j-sset

networks:
  raft-backend:
    name: ${CMS_RAFT_DOCKER_NETWORK:-cms-server-cms-raft-node_raft-net}
    external: true

services:
  cms-j-sset-volume-init:
    image: busybox:1.36
    user: "0:0"
    volumes:
      - app-shared:/data
    command:
      [
        "sh",
        "-c",
        "mkdir -p /data && chown -R 1000:1000 /data && chmod 775 /data",
      ]
    restart: "no"

  cms-j-sset-agent:
    image: cms-agent:1.0.0-beta3-6
    user: "1000:1000"
    stop_grace_period: 60s
    depends_on:
      cms-j-sset-volume-init:
        condition: service_completed_successfully
    networks:
      - default
      - raft-backend
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      POD_NAME: cms-j-sset-0
      CMS_NAMESPACE: dev
      CMS_SERVICE: cms-j-sset
      CMS_SERVER_HOST: ipv4:///172.20.0.3:9090,172.20.0.2:9090,172.20.0.6:9090
      CMS_APPID: cms-j-sset-0
      CMS_PROPERTIES_FILE: /app/config/application.json
      CMS_REVISION_FILE: /app/config/сms.revision
      CMS_UNIX_SOCKET_PATH: /app/config/cms.sock
      CMS_MAX_FAILED_QUEUE_SIZE: 1500
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        exec /app/cmsagent
    volumes:
      - app-shared:/app/config
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "test -f /proc/1/cmdline && grep -qa cmsagent /proc/1/cmdline",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        reservations:
          cpus: "0.1"
          memory: 40M
        limits:
          cpus: "0.5"
          memory: 60M

  cms-j-sset-example:
    image: cms-java-example:1.0.1
    user: "1000:1000"
    stop_grace_period: 60s
    depends_on:
      cms-j-sset-agent:
        condition: service_started
    ports:
      - "${JAVA_EXAMPLE_HTTP_PORT:-8080}:8080"
    environment:
      CMS_PROPERTIES_FILE: /app/config/application.json
      CMS_UNIX_SOCKET_PATH: /app/config/cms.sock
    volumes:
      - app-shared:/app/config
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080'",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 120s

volumes:
  app-shared:
