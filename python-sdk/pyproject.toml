[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "cms-sdk"
version = "0.1.0"
description = "Config Management System — Python client SDK"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["protobuf>=5"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["."]
include = ["cms*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
