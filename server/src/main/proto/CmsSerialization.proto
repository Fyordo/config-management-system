syntax = "proto3";

package com.fyordo.cms;

option java_package = "com.fyordo.cms";
option java_outer_classname = "CmsProto";

enum RaftOp {
  RAFT_OP_UNSPECIFIED = 0;
  RAFT_OP_PUT = 2;
  RAFT_OP_DELETE = 3;
}

enum RaftResultStatus {
  RAFT_RESULT_STATUS_UNSPECIFIED = 0;
  RAFT_RESULT_STATUS_OK = 1;
  RAFT_RESULT_STATUS_NOT_FOUND = 2;
  RAFT_RESULT_STATUS_ERROR = 3;
}

message PropertyKey {
  uint32 version = 1;
  string namespace = 2;
  string service = 3;
  string app_id = 4;
  string key = 5;
}

message PropertyValue {
  uint32 version = 1;
  int64 last_modified_ms = 2;
  bytes value = 3;
}

message PropertyInternalDto {
  PropertyKey key = 1;
  PropertyValue value = 2;
}

message PropertyInternalList {
  repeated PropertyInternalDto items = 1;
}

message PropertyQueryFilter {
  optional string namespace_regex = 1;
  optional string service_regex = 2;
  optional string app_id_regex = 3;
  optional string key_regex = 4;
  optional string value_regex = 5;
  uint32 limit = 6;
}

message RaftCommand {
  uint32 version = 1;
  RaftOp operation = 2;
  optional PropertyKey key = 3;
  bytes value = 4;
}

message RaftResult {
  uint32 version = 1;
  bytes result = 2;
  RaftResultStatus status = 3;
}
