syntax = "proto3";

package com.fyordo.cms;

option java_package = "com.fyordo.cms";
option java_outer_classname = "CmsProto";

enum RaftOpProto {
  RAFT_OP_UNSPECIFIED = 0;
  RAFT_OP_GET = 1;
  RAFT_OP_PUT = 2;
  RAFT_OP_DELETE = 3;
  RAFT_OP_QUERY = 4;
}

enum RaftResultStatusProto {
  RAFT_RESULT_STATUS_UNSPECIFIED = 0;
  RAFT_RESULT_STATUS_OK = 1;
  RAFT_RESULT_STATUS_NOT_FOUND = 2;
  RAFT_RESULT_STATUS_ERROR = 3;
}

message PropertyKeyProto {
  uint32 version = 1;
  string namespace = 2;
  string service = 3;
  string app_id = 4;
  string key = 5;
}

message PropertyValueProto {
  uint32 version = 1;
  int64 last_modified_ms = 2;
  bytes value = 3;
}

message PropertyInternalDtoProto {
  PropertyKeyProto key = 1;
  PropertyValueProto value = 2;
}

message PropertyInternalListProto {
  repeated PropertyInternalDtoProto items = 1;
}

message PropertyQueryFilterProto {
  optional string namespace_regex = 1;
  optional string service_regex = 2;
  optional string app_id_regex = 3;
  optional string key_regex = 4;
  optional string value_regex = 5;
  uint32 limit = 6;
}

message RaftCommandProto {
  uint32 version = 1;
  RaftOpProto operation = 2;
  optional PropertyKeyProto key = 3;
  bytes value = 4;
}

message RaftResultProto {
  uint32 version = 1;
  bytes result = 2;
  RaftResultStatusProto status = 3;
}
