syntax = "proto3";

package com.fyordo.cms;

service AgentChannelService {
  rpc WatchProperties (AgentConnectRequest) returns (stream ServerStreamEvent);
}

message AgentConnectRequest {
  string namespace = 1;
  string service = 2;
  string appId = 3;
}

message ServerStreamEvent {
  oneof command {
    ServerInitEvent initEvent = 1;
    ServerPropertyUpdateEvent updateEvent = 2;
  }
}

message Property {
  string key = 1;
  bytes value = 2;
}

message ServerInitEvent {
  int64 lastModifiedMs = 1;
  repeated Property properties = 2;
}

message ServerPropertyUpdateEvent {
  Property property = 1;
  int64 lastModifiedMs = 2;
}